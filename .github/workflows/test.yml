name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（使用锁文件）
        run: docker build -t grok-search:ci .
      - name: 未设置令牌时必须拒绝启动
        run: |
          set +e
          docker run --rm -e GROK_API_URL=http://127.0.0.1:9 -e GROK_API_KEY=x grok-search:ci
          code=$?
          echo "exit code: $code"
          test "$code" = "2"
      - name: 设置令牌后健康检查与鉴权
        run: |
          docker run -d --name gs -p 8000:8000 \
            -e GROK_API_URL=http://127.0.0.1:9 -e GROK_API_KEY=x \
            -e GROK_MCP_AUTH_TOKEN=ci-token grok-search:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fs localhost:8000/health; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "/health 30 秒内未就绪"; docker logs gs; exit 1
          fi
          fail() { echo "::error::$1"; docker logs gs || true; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/mcp/)
          [ "$code" = "401" ] || fail "无令牌请求应返回 401，实际 $code"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer ci-token' \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            localhost:8000/mcp/)
          [ "$code" = "200" ] || fail "带令牌 initialize 应返回 200，实际 $code"
          user=$(docker inspect -f '{{.Config.User}}' gs)
          [ "$user" = "app" ] || fail "容器应以 app 用户运行，实际 $user"
          start=$(date +%s)
          docker stop -t 15 gs
          took=$(( $(date +%s) - start ))
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' gs)
          echo "docker stop 用时 ${took}s，退出码 ${exit_code}"
          docker logs gs 2>&1 | grep -q "连接池已关闭" || fail "未执行生命周期清理（用时 ${took}s，退出码 ${exit_code}）"
          [ "$exit_code" = "0" ] || fail "优雅退出码应为 0，实际 ${exit_code}"
          docker rm gs
